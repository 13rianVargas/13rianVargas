  <text x="26" y="88" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#FFF8DC" fill-opacity="0.88">Won the voucher that paid for the CCST</text><text x="26" y="107" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#FFF8DC" fill-opacity="0.88">exam — which I then passed at 974/1000.</text>

