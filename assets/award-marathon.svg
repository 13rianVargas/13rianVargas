  <text x="26" y="88" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#FFF8DC" fill-opacity="0.88">University representative against ~120 teams,</text><text x="26" y="107" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#FFF8DC" fill-opacity="0.88">qualifier for the Latin American Regional.</text><text x="26" y="126" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#FFF8DC" fill-opacity="0.88">Solved in Java, Python and C++.</text>

